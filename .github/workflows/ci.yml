name: RaceDay CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  validate-part1-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi

      - name: Verify required Part 1 files exist
        run: |
          required_files=("docs/ERD.pdf" "docs/RaceDay_API_Endpoint_Plan.pdf" "docs/RaceDay_Database.sql")
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing required file: $f"
              exit 1
            fi
          done

      - name: Verify README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing at repository root."
            exit 1
          fi

  build-and-test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay.Api/RaceDay.Api.sln

      - name: Build
        run: dotnet build RaceDay.Api/RaceDay.Api.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.Api/RaceDay.Api.sln --no-build --configuration Release --verbosity normal
