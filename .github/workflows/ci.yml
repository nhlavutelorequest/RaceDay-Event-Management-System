name: RaceDay CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

env:
  SOLUTION: RaceDay.Api/RaceDay.Api/RaceDay.Api.sln

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs folder
        run: |
          test -f docs/ERD.pdf
          test -f docs/RaceDay_API_Endpoint_Plan.pdf
          test -f docs/RaceDay_Database.sql

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build API and MVC
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --no-build --configuration Release