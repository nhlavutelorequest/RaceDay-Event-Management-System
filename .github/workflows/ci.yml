name: RaceDay CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  validate-part1-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Verify required Part 1 files exist
        run: |
          required_files=("docs/ERD.pdf" "docs/RaceDay_API_Endpoint_Plan.pdf" "docs/RaceDay_Database.sql")
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing required file: $f"
              missing=1
            else
              echo "Found: $f"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Verify README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing at repository root."
            exit 1
          fi
          echo "README.md found."

      - name: All Part 1 structure checks passed
        run: echo "Repository structure is valid for Part 1 submission."
