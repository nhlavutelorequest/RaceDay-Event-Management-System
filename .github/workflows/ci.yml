      - name: Verify API project exists
        run: |
          if [ ! -f "RaceDay.Api/RaceDay.Api/RaceDay.Api.csproj" ]; then
            echo "ERROR: RaceDay.Api.csproj was not found."
            find . -maxdepth 4 -type f \( -name "*.csproj" -o -name "*.sln" \) -print
            exit 1
          fi
          echo "RaceDay.Api.csproj found."

      - name: Verify test project exists
        run: |
          if [ ! -f "RaceDay.Api/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj" ]; then
            echo "ERROR: RaceDay.Api.Tests.csproj was not found."
            find . -maxdepth 4 -type f -name "*.csproj" -print
            exit 1
          fi
          echo "RaceDay.Api.Tests.csproj found."

      - name: Restore dependencies
        run: dotnet restore RaceDay.Api/RaceDay.Api.sln

      - name: Build
        run: dotnet build RaceDay.Api/RaceDay.Api.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.Api/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --no-build --configuration Release --verbosity normal
